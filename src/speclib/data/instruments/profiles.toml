# Numerical wavelengths and coverage intervals are in vacuum micrometers.
schema_version = 1

[defaults]
quality = "tabulated"
calibration_version = "STScI JDox snapshot retrieved 2026-10-17 (source bytes pinned by SHA-256)"
source = "STScI NIRSpec Dispersers and Filters; Jakobsen et al. (2022), A&A 661, A80"
source_url = "https://jwst-docs.stsci.edu/jwst-near-infrared-spectrograph/nirspec-instrumentation/nirspec-dispersers-and-filters"
coverage_source_url = "https://jwst-docs.stsci.edu/jwst-near-infrared-spectrograph/nirspec-operations/nirspec-bots-operations/nirspec-bots-wavelength-ranges-and-gaps"
configuration = "BOTS/S1600A1/SUB2048"
resolution_definition = "Published R=lambda/delta_lambda for a 2.2-pixel spectral element, treated as Gaussian FWHM"
assumptions = [
  "Nominal disperser model, not a measured BOTS point-source LSF; no slit-illumination correction",
  "Approximate SUB2048 coverage from BOTS Table 1; boundaries/gaps depend on the observation",
  "Negligible intrinsic source width; no finite-resolution correction or deconvolution",
  "Coordinates treated as vacuum wavelengths; FITS labels MICRONS without an air/vacuum flag; linear interpolation of published R; no extrapolation",
]

[[profiles]]
mode = "jwst/nirspec/prism/clear"
curve = "prism.csv"
provenance_ref = "sources.json#prism"
valid_intervals_um = [[0.6, 5.3]]
aliases = ["jwst/nirspec/bots/s1600a1/sub2048/prism/clear"]

