name: Installation smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install "poetry>=2,<3"
          poetry build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/speclib-install"
          "$RUNNER_TEMP/speclib-install/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/speclib-install/bin/python" -m pip check
      - name: Check installed metadata and imports
        run: |
          "$RUNNER_TEMP/speclib-install/bin/python" -I - <<'PY'
          from importlib.metadata import requires

          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet

          dependencies = [Requirement(value) for value in requires("speclib")]
          specutils = [dep for dep in dependencies if dep.name == "specutils"]
          assert len(specutils) == 1, specutils
          assert specutils[0].specifier == SpecifierSet(">=2,<3"), specutils[0]

          import speclib
          from speclib import Spectrum

          print(f"Installed {speclib.__version__}: {specutils[0]}; {Spectrum}")
          PY
