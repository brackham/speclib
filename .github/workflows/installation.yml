name: Installation smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install "poetry>=2,<3"
          poetry build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/speclib-install"
          "$RUNNER_TEMP/speclib-install/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/speclib-install/bin/python" -m pip check
      - name: Check installed metadata and imports
        run: |
          "$RUNNER_TEMP/speclib-install/bin/python" -I - <<'PY'
          from importlib.metadata import requires
          import tomllib

          from packaging.requirements import Requirement

          with open("pyproject.toml", "rb") as source:
              project = tomllib.load(source)["project"]
          expected = {Requirement(value) for value in project["dependencies"]}
          installed = {Requirement(value) for value in requires(project["name"])}
          assert installed == expected, {
              "missing": expected - installed,
              "unexpected": installed - expected,
          }

          import speclib
          from speclib import Spectrum

          print(f"Installed {speclib.__version__}: {len(installed)} runtime requirements match pyproject.toml; {Spectrum}")
          PY
